<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📦ВашСклад - Склады и движение</title>

    <link rel="stylesheet" href="./css/general.css">
    <link rel="stylesheet" href="./css/topnav.css">
    <link rel="stylesheet" href="./css/table.css">
    <link rel="stylesheet" href="./css/warehouses.css">
    <link rel="stylesheet" href="./css/modal.css">

    <script src="./js/warehouses.js"></script>
    <script src="./js/general.js"></script>
</head>
<body onload="loadTopnav('warehouses'); loadWarehousesPage()">

    <div id="modal-background" class="not-visible">

      <div id="warehouse-form" class="modal-form not-visible">
          <h2>Добавление новой точки</h2>

          <div style="display:flex; flex-grow:1; flex-shrink:1;">
            <form>
              <div style = "width: 70%;">
                <label for="warehouse-name">Название *</label>
                <input id="warehouse-name" name="warehouseName" required/>

                <label for="warehouse-address">Адрес *</label>
                <textarea id="warehouse-address" name="warehouseAddress" required></textarea>
              </div>

              <div class="form-controls">
                <input type="button" value="Отмена" onclick="closeAllForms()"/>
                <input type="submit" value="Создать" onsubmit=""/>
              </div>
            </form>
          </div>
          
      </div>

      <div id="movement-form" class="modal-form not-visible">
          <h2>Оформление отгрузки</h2>

          <div style="display:flex; flex-grow:1; flex-shrink:1;">
            <form>
              <div style = "width: 70%;">
                <label for="out-warehouse-name">Склад отгрузки</label>
                <select id="out-warehouse-name" name="outWarehouseName" disabled>
                    <!-- Filled dynamically for currently selected warehouse -->
                </select>

                <label for="in-warehouse-name">Склад поставки</label>
                <select id="in-warehouse-name" name="inWarehouseName">
                    <!-- Filled dynamically for other warehouses -->
                </select>

                <label for="movement-product-name">Товар</label>
                <select id="movement-product-name" name="movementProductName" required>
                    <!-- Filled dynamically for current stock items in the selected warehouse -->
                </select>

                <label for="movement-quantity">Количество *</label>
                <input type="number" id="movement-quantity" name="movementQuantity" required/>  <!-- Quantity filled dynamically based on chosen product -->

                <label for="movement-date">Дата и время</label>
                <input type="datetime-local" id="movement-date" name="movementDate" min="" max=""/>

                <label for="movement-operator">Оператор *</label>
                <input id="movement-operator" name="movementOperator" required/>

              </div>

              <div class="form-controls">
                <input type="button" value="Отмена" onclick="closeAllForms()"/>
                <input type="submit" value="Создать" onsubmit=""/>
              </div>
            </form>
          </div>
          
      </div>

      <div id="report-form" class="modal-form not-visible" style="width:600px; height:400px;">
          <h2>Создание отчета по текущим остаткам</h2>

          <div style="display:flex; flex-grow:1; min-height: 0; flex-shrink:1; height: 350px; flex-flow:column;">
            <form>

                <div style="width:100%; height: 85%; display: flex;">
                    <fieldset id="warehouse-filters" class="content-column" style="width:50%; height:min-content; max-height: 85%;">
                        <legend style="display:flex; flex-flow:row; align-items: center; gap: 5px;">
                            Включить склады
                            <div>
                                <button type="button" title="Выбрать все" onclick="" class="icon-button">
                                    <span class="material-symbols-outlined">select_check_box</span>
                                </button>
                            </div>
                        </legend>
                        <!-- Dynamically filled with checkboxes here -->
                    </fieldset>

                    <fieldset id="category-filters" class="content-column" style="width:50%; height:min-content; max-height: 85%;">
                        <legend style="display:flex; flex-flow:row; align-items: center; gap: 5px;">
                            Включить категории
                            <div>
                                <button type="button" title="Выбрать все" onclick="" class="icon-button">
                                    <span class="material-symbols-outlined">select_check_box</span>
                                </button>
                            </div>
                        </legend>
                        <!-- Dynamically filled with checkboxes here -->
                    </fieldset>
                </div>
                

                <div class="form-controls" style="width: 100%; display: flex; flex-flow:row-reverse; margin:initial; align-self: flex-end;">
                    <input type="submit" value="Создать" onsubmit=""/>
                    <input type="button" value="Отмена" onclick="closeAllForms()"/>
                </div>

            </form>

          </div>
          
      </div>

    </div>


    <div class="topnav" id="topnav">
      <!-- Filled dynamically -->
    </div>

    <div class="warehouse-container">

        <div class="warehouse-list-section">

            <div style="display: flex; justify-content: center;">
                <h2 class="table-title" style="display: block">Склады</h2>
                <div class="table-controls" style="display:block; width:min-content;">
                <button class="material-icon-button" style = "
                    background-color: rgb(255, 249, 245);
                    border-color: #9c7562;
                    color: rgb(80, 43, 32);
                    width: 220px;
                    margin-bottom: 10px;
                    "
                    onclick="showWarehouseForm()">
                    <span class="material-symbols-outlined">add</span>
                    <span style="position: relative; top:1px;">Добавить точку</span>
                </button>
                <button class="material-icon-button" style = "
                        background-color: rgb(255, 249, 245);
                        border-color: #9c7562;
                        color: rgb(80, 43, 32);
                        width: 220px;
                        margin-bottom: 10px;
                        "
                        onclick="showMovementForm()">
                        <span class="material-symbols-outlined">add</span>
                        <span style="position: relative; top:1px;">Оформить отгрузку</span>
                    </button>
                <button style = "
                    background-color: #21a366;
                    border-color: #236123;
                    color: white;
                    width: 220px;
                " onclick="showReportForm()">
                    Создать отчет Excel
                </button>
                </div>

            </div>

            <table id="warehousesTable">
                <thead>
                    <tr>
                        <th>
                            <span>Название</span>
                        </th>
                        <th>
                            <span>Адрес</span>
                        </th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Filled dynamically -->
                </tbody>
            </table>
        </div>

        <div class="warehouse-details-section" id="warehouseDetails">
            <div class="detail-block">
                <h3 class="table-title detail-title">Остатки на складе</h3>
                <div class="detail-title-container"></div>

                <div class="table-scroll">
                    <table id="stockItemsTable">
                        <thead>
                            <tr>
                                <th><span>Артикул</span></th>
                                <th><span>Товар</span></th>
                                <th><span>Кол-во</span></th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Filled dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="detail-block">
                
                <h3 class="table-title detail-title">Движения</h3>
                <div class="detail-title-container"></div>


                <div class="table-scroll">
                    <table id="movementsTable">
                        <thead>
                            <tr>
                                <th><span>Товар</span></th>
                                <th><span>Кол-во</span></th>
                                <th><span>Откуда</span></th>
                                <th><span>Куда</span></th>
                                <th><span>Оператор</span></th>
                                <th><span style = "min-width: 150px">Дата</span></th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Filled dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
