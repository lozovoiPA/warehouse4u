<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📒ВашСклад - Каталог товаров</title>

    <link rel="stylesheet" href="./css/general.css">
    <link rel="stylesheet" href="./css/topnav.css">
    <link rel="stylesheet" href="./css/table.css">
    <link rel="stylesheet" href="./css/modal.css">

    <script src="./js/catalogue.js"></script>
    <script src="./js/general.js"></script>
</head>
<body onload="loadTopnav('catalogue'); loadCatalogue()">

    <div id="modal-background" class="not-visible">
      <div id="product-form" class="modal-form">
          <h2>Создание товара</h2>

          <div style="display:flex; flex-grow:1; flex-shrink:1;"> <!-- Флексы позволяют заполнить пространтсво. height: не работает поскольку не учитывает margin h2-->
            <form>
              <div style = "width: 70%;">
                <label for="product-name">Наименование *</label>
                <input id="product-name" name="productName" required/>

                <label for="product-category">Категория</label>
                <select id="product-category" name="productCategory">
                  <!-- Заполняется динамически -->
                </select>
                
                <label for="product-units">Единицы измерения</label>
                <select id="product-units" name="productUnits">
                  <!-- Заполняется динамически -->
                </select>
              </div>

              <div class="form-controls">
                <input type="button" value="Отмена" onclick="closeProductForm()"/>
                <input type="submit" value="Создать" onsubmit=""/>
              </div>
            </form>
          </div>
          
      </div>
    </div>

    <div class="topnav" id="topnav">
      <!-- Filled dynamically -->
    </div>

    <div style="width:fit-content; margin: 5px;">
      <div style="display: flex; justify-content: center;">
        <h2 class="table-title">Каталог товаров</h2>
        <div class="table-controls">
          <button class="material-icon-button" style = "
            background-color: rgb(255, 249, 245);
            border-color: #9c7562;
            color: rgb(80, 43, 32);
            "
            onclick="showProductForm()">
            <span class="material-symbols-outlined">add</span>
            <span style="position: relative; top:1px;">Добавить товар</span>
          </button>
          <button style = "
            background-color: #21a366;
            border-color: #236123;
            color: white;
          ">
            Создать отчет Excel
          </button>
        </div>

      </div>
      <table id="productsTable">
          <thead>
              <tr>
                <th>
                  <span>Артикул</span>
                </th>
                <th>
                  <span>Наименование</span>
                </th>
                <th>
                  <div>
                    <span style="max-width:90px;">Категория товара</span>
                    <div style="gap:1px; height:unset;">
                      <button title="Фильтр по категориям">
                        <span class="material-symbols-outlined">filter_alt</span>
                      </button><br/>
                      <button title="Настройка категорий">
                        <span class="material-symbols-outlined">settings</span>
                      </button>
                    </div>
                  </div>
                </th>
                <th>
                  <div>
                    <span style="max-width:90px;">Единицы измерения</span>
                    <div style="gap:1px; height:unset;"> <!-- Add "display: block" to align buttons vertically -->
                      <button title="Фильтр по единицам измерения">
                        <span class="material-symbols-outlined">filter_alt</span>
                      </button><br/>
                      <button title="Настройка единиц измерения">
                        <span class="material-symbols-outlined">settings</span>
                      </button>
                    </div>
                  </div>
                </th>
              </tr>
          </thead>
          <tbody>
            <!-- Filled dynamically -->
          </tbody>
      </table>
    </div>
</body>
</html>
